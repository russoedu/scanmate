name: Parity

# NOT generated by MoNecromanCI, and deliberately its own file.
#
# `ci.yml` is mnci-owned: `mnci upgrade` rewrites it wholesale, so a step added
# there would survive exactly until the next upgrade and then vanish without a
# word. This check is scanmate-specific — mnci has no opinion about parity
# goldens — so it lives where an upgrade cannot reach it.
#
# WHAT IT GUARDS
#
# `python-packages/scanmate-ink` and `python-packages/scanmate-align` are
# parallel ports of `@scanmate/ink` and `@scanmate/align`, and the only useful
# definition of "correct" for them is that they produce the same numbers as the
# TypeScript, bit for bit. The Python tests prove that against the goldens
# committed in `tools/parity/goldens`.
#
# Every package the writer imports has to be built here, or it fails on a
# missing import rather than on a stale golden - adding a package to
# `write-goldens.mts` means adding it to the build step below.
#
# Nothing in `ci.yml` regenerates those goldens. So a change to the TypeScript
# that moves a number leaves them stale, the Python tests keep passing against
# the old values, and the two implementations diverge in silence — which is the
# exact failure `tools/parity/check-fresh.mts` was written to prevent and was
# never wired up to catch.
#
# This runs it: regenerate from the real build, and fail if anything moved.
# When it fails, commit the regenerated goldens TOGETHER with whatever Python
# change keeps the port in step — never on their own.

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        name: Install dependencies

      # The writer imports each package's `dist`, so the build has to have
      # happened. Built explicitly rather than relying on the verify step in
      # ci.yml: that one is `nx affected` on a pull request, so a PR touching
      # only Python would never build them and this would fail on a missing
      # import rather than on a stale golden.
      #
      # `run-many -p a,b`, NOT `nx build a b`. The second form passes `b` as an
      # argument to a's build COMMAND - here that made rollup bundle
      # `@scanmate/align` into ink's own output, which succeeds silently on a
      # machine where align's dist already exists and fails only on a clean
      # checkout. This step is that clean checkout, and it caught it.
      - run: npx nx run-many -t build -p @scanmate/ink,@scanmate/align
        name: Build the TypeScript the goldens are generated from

      - run: npm run parity:check
        name: Goldens match the current TypeScript build
