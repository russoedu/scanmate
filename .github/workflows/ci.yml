name: CI

# Generated by MoNecromanCI. Deliberately thin: Nx builds, 'nx release'
# versions from conventional commits and pushes ONLY a tag to main, and each
# app is packed into dist/drop/<type>-<name>.zip by its own 'package' target.
# The GitHub Actions equivalent of azure-pipelines.yml — see there for the
# fuller rationale; both stay hand-kept in lockstep, there is no shared template.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # One run at a time per ref, but `cancel-in-progress` is an **expression** on
  # purpose rather than a flat `true`.
  #
  # A superseded PR run is pure waste, so cancel it. A run on `main` must never
  # be cancelled: it publishes packages and pushes release tags, and killing it
  # part-way can leave a tag pushed with the publish only half done — a state no
  # rerun repairs cleanly, because the version is then already tagged. Those runs
  # queue instead, which also stops two `nx release` invocations racing to create
  # the same tag when two commits land close together.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Lets the release step push the version tag nx release creates back to main,
  # and (github-only provider) create the GitHub Release itself.
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version resolution needs the release tags.
      - run: git fetch --all --prune --tags
        name: Fetch branches and release tags

      - run: git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
        name: Set the git identity used for release tags

      # Pinned, not inherited. Every Python guard below shells out to `python3`,
      # and the runner image's default moves without notice - so the version the
      # wheels are built and tested against would drift with the image rather
      # than with this file. 3.12 is what the packages declare support for;
      # `requires-python` is >=3.11, so this is the lowest supported minor plus
      # one, which is where a version-specific break would show up first.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Caches ~/.npm keyed on package-lock.json, so `npm ci` restores from
          # the local cache instead of re-downloading every tarball on every run.
          # Nothing to invalidate by hand: the action keys on the lockfile, so a
          # dependency change misses the cache and a no-op change hits it.
          cache: npm

      # setup-node installs whatever npm the Node image bundles, and npm's major
      # is part of the contract: npm 11 reuses an already-installed tree instead
      # of re-resolving, so it applies `overrides` differently from npm 10. See
      # NPM_VERSION's remarks for the measurement.
      - run: npm install -g npm@11
        name: Pin npm to the major mnci verifies against

      - run: npm ci
        name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Fails ONLY on an advisory that has a published fix, at moderate or
      # above; anything upstream has not fixed is printed and passes. See
      # NPM_AUDIT_STEP's remarks for why that split replaced a warn-only step.
      - run: node -e "const cp=require('node:child_process');const r=cp.spawnSync('npm',['audit','--json'],{encoding:'utf8',shell:process.platform==='win32',maxBuffer:33554432});let d;try{d=JSON.parse(r.stdout)}catch{console.log('npm audit produced no JSON (exit '+r.status+') - not blocking on a broken audit.');process.exit(0)}const all=Object.values(d.vulnerabilities||{});const BLOCK=['critical','high','moderate'];const act=all.filter(v=>v.fixAvailable&&BLOCK.includes(v.severity));const rest=all.filter(v=>!act.includes(v));for(const v of rest)console.log('  note ['+v.severity+'] '+v.name+(v.fixAvailable?' - fix available, below the blocking threshold':' - NO fix available upstream, nothing to do here'));if(act.length===0){console.log('npm audit - '+all.length+' advisory(ies), none actionable at moderate or above.');process.exit(0)}for(const v of act)console.log('  BLOCKING ['+v.severity+'] '+v.name+' - fix available'+(v.fixAvailable&&v.fixAvailable.isSemVerMajor?' (semver-major)':''));console.log('Each has a published fix. Add a targeted overrides entry in package.json rather than npm audit fix --force.');process.exit(1)"
        name: npm audit (fails on an actionable advisory)

      # Installs the fixed Python toolchain (ruff, pytest, build, twine,
      # pip-audit) — written by 'mnci add' to requirements-dev.txt on the
      # first Python project. Plain pip, no uv/Poetry: portable guard skips
      # cleanly on a workspace with none.
      - run: node -e "if(!require('node:fs').existsSync('requirements-dev.txt')){console.log('No Python projects - skipping.');process.exit(0)}const py=process.platform==='win32'?'python':'python3';process.exit(require('node:child_process').spawnSync(py+' -m pip install -r requirements-dev.txt',{stdio:'inherit',shell:true}).status ?? 1)"
        name: Install Python dependencies (ruff, pytest, build, twine, pip-audit)

      # Editable-installs every Python project into one shared environment, the
      # pip-world counterpart of 'npm install' hoisting every workspace package
      # into one root node_modules — so a project that imports an internal lib
      # (normally vendored only at build time) can resolve that import at
      # lint/test time too. Portable guard skips cleanly on a workspace with none.
      - run: node -e "const fs=require('node:fs'),path=require('node:path');const editableDirs=[...fs.globSync('apps/*/pyproject.toml'),...fs.globSync('python-packages/*/pyproject.toml'),...fs.globSync('libs/*/pyproject.toml')].map((p)=>path.dirname(p));const requirementsFiles=fs.globSync('apps/*/requirements.txt');if(editableDirs.length===0&&requirementsFiles.length===0){console.log('No Python projects - skipping.');process.exit(0)}const args=['-m','pip','install','--quiet',...editableDirs.flatMap((d)=>['-e',d]),...requirementsFiles.flatMap((f)=>['-r',f])];const py=process.platform==='win32'?'python':'python3';process.exit(require('node:child_process').spawnSync(py,args,{stdio:'inherit'}).status ?? 1)"
        name: Install Python project dependencies (editable, workspace-wide)

      # Non-blocking, same reasoning as the npm audit step above. Runs after
      # the workspace-wide install so it scans the workspace's actual
      # dependency set, not just the fixed toolchain.
      - run: node -e "if(!require('node:fs').existsSync('requirements-dev.txt')){console.log('No Python projects - skipping.');process.exit(0)}const py=process.platform==='win32'?'python':'python3';require('node:child_process').spawnSync(py,['-m','pip_audit'],{stdio:'inherit'});process.exit(0)"
        name: pip-audit (non-blocking)

      # Go, if the workspace has any: hosted runners ship the toolchain, so
      # only the module cache and the linter need seeding. Both guards skip
      # cleanly on a workspace with no root go.mod.
      - run: node -e "if(!require('node:fs').existsSync('go.mod')){console.log('No Go projects - skipping.');process.exit(0)}process.exit(require('node:child_process').spawnSync('go',['mod','download'],{stdio:'inherit'}).status ?? 1)"
        name: Download Go module dependencies

      # golangci-lint is what the generated Go lint target actually runs (the
      # plugin's own default is 'go fmt', which only reformats). 'go install'
      # drops it in GOPATH/bin, which is not on PATH by default on a hosted
      # runner — so publish it for every later step in the job.
      - run: node -e "const fs=require('node:fs'),cp=require('node:child_process');if(!fs.existsSync('go.mod')){console.log('No Go projects - skipping.');process.exit(0)}if(cp.spawnSync('golangci-lint',['--version'],{stdio:'ignore'}).status===0){console.log('golangci-lint already installed - skipping.');process.exit(0)}process.exit(cp.spawnSync('go',['install','github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest'],{stdio:'inherit'}).status ?? 1)"
        name: Install golangci-lint

      - run: node -e "const fs=require('node:fs'),cp=require('node:child_process');if(!fs.existsSync('go.mod')){console.log('No Go projects - skipping.');process.exit(0)}const r=cp.spawnSync('go',['env','GOPATH'],{encoding:'utf8'});if(r.status!==0){console.log('Could not resolve GOPATH - skipping.');process.exit(0)}const bin=require('node:path').join(r.stdout.trim(),'bin');if(!process.env.GITHUB_PATH){console.log('Not running in GitHub Actions - skipping.');process.exit(0)}fs.appendFileSync(process.env.GITHUB_PATH,bin+'\n')"
        name: Add Go tool bin to PATH

      # Flutter, if the workspace has any. Unlike Python and Go, hosted runners
      # do NOT ship the Flutter SDK, so this installs it (shallow git clone at
      # a pinned tag) and puts it on PATH. All three guards skip cleanly on a
      # workspace with no root pubspec.yaml, and the install also skips when an
      # SDK is already on PATH.
      - run: node -e "const fs=require('node:fs'),cp=require('node:child_process');if(!fs.existsSync('pubspec.yaml')){console.log('No Flutter projects - skipping.');process.exit(0)}if(cp.spawnSync('flutter',['--version'],{stdio:'ignore',shell:process.platform==='win32'}).status===0){console.log('Flutter SDK already on PATH - skipping.');process.exit(0)}const sdk=require('node:path').join(require('node:os').homedir(),'.mnci-flutter-3.44.8');if(fs.existsSync(sdk)){console.log('Flutter SDK already installed at '+sdk+' - skipping.');process.exit(0)}process.exit(cp.spawnSync('git',['clone','--depth','1','--branch','3.44.8','https://github.com/flutter/flutter.git',sdk],{stdio:'inherit'}).status ?? 1)"
        name: Install the Flutter SDK (3.44.8)

      - run: node -e "const fs=require('node:fs'),path=require('node:path');if(!fs.existsSync('pubspec.yaml')){console.log('No Flutter projects - skipping.');process.exit(0)}const sdk=require('node:path').join(require('node:os').homedir(),'.mnci-flutter-3.44.8');if(!fs.existsSync(sdk)){console.log('Flutter SDK was not installed by mnci (already on PATH) - skipping.');process.exit(0)}const bin=path.join(sdk,'bin');if(!process.env.GITHUB_PATH){console.log('Not running in GitHub Actions - skipping.');process.exit(0)}fs.appendFileSync(process.env.GITHUB_PATH,bin+'\n')"
        name: Add the Flutter SDK to PATH

      # One command resolves EVERY Dart dependency, internal and external, for
      # the whole workspace: the projects are pub workspace members, so this
      # writes a single root pubspec.lock they all share.
      - run: node -e "const fs=require('node:fs');if(!fs.existsSync('pubspec.yaml')){console.log('No Flutter projects - skipping.');process.exit(0)}process.exit(require('node:child_process').spawnSync('flutter',['pub','get'],{stdio:'inherit',shell:process.platform==='win32'}).status ?? 1)"
        name: Resolve Dart dependencies (one pub get for the whole workspace)

      # .NET, if the workspace has any. actions/setup-dotnet is the
      # maintained, cached installer GitHub itself ships, so this uses it
      # directly rather than a hand-rolled 'node -e' guard — see
      # DOTNET_DETECT_AZURE's remarks for the full reasoning. hashFiles()
      # gates it inline, so a JS-only workspace pays nothing.
      - uses: actions/setup-dotnet@v6
        if: ${{ hashFiles('apps/*/*.csproj', 'packages/*/*.csproj', 'libs/*/*.csproj') != '' }}
        with:
          dotnet-version: 10.0.x

      # Fails fast, with an unambiguous message, when a stale TypeScript project
      # reference (or another sync generator's drift) was never synced+committed
      # locally — sync.applyChanges (nx.json) only auto-applies interactively, so
      # CI still needs its own explicit, early check rather than surfacing this as
      # a confusing failure buried inside the build step below.
      - run: npx nx sync:check
        name: Verify the workspace is synced (run 'npx nx sync' locally and commit if this fails)

      # The one verify step, and deliberately the only one: affected projects on
      # a pull request, EVERY project on anything else (a push to main included,
      # so a release is always verified in full). Every fallback — no target
      # branch, an unresolvable merge-base — takes the full path, because a run
      # that verifies too little still reports green.
      #
      # 'npm run lint' is 'nx run-many -t lint', a strict subset of the targets
      # below, so adding it back as its own step would only duplicate work — and
      # on a pull request it would re-lint every project, discarding the point
      # of this.
      - run: node -e "const cp=require('node:child_process');const T='lint,typecheck,test,build';const all=()=>process.exit(cp.spawnSync('npx nx run-many -t '+T,{stdio:'inherit',shell:true}).status ?? 1);const ref=process.env.GITHUB_BASE_REF||process.env.SYSTEM_PULLREQUEST_TARGETBRANCH||'';if(!ref){console.log('Not a pull request - verifying EVERY project.');all()}const target=ref.replace('refs/heads/','');const mergeBase=r=>{const o=cp.spawnSync('git',['merge-base',r,'HEAD'],{encoding:'utf8'});return o.status===0?o.stdout.trim():''};let base=mergeBase('origin/'+target);if(!base){console.log('No origin/'+target+' ref - fetching it to resolve a merge-base.');cp.spawnSync('git',['fetch','--no-tags','origin',target],{stdio:'inherit'});base=mergeBase('FETCH_HEAD')}if(!base){console.log('Could not resolve a merge-base with '+target+' - verifying EVERY project.');all()}console.log('Pull request against '+target+' - verifying projects affected since '+base);process.exit(cp.spawnSync('npx nx affected -t '+T+' --base='+base,{stdio:'inherit',shell:true}).status ?? 1)"
        name: Verify (affected on a PR, every project on main)

      # Pack every app into dist/drop/<type>-<name>.zip via each app's 'package'
      # target. Portable guard: skip cleanly when the workspace has no apps yet.
      - run: node -e "const fs=require('node:fs');fs.mkdirSync('dist/drop',{recursive:true});const hasProjectJson=fs.globSync('apps/*/project.json').length>0;const hasInlineNx=fs.globSync('apps/*/package.json').some((f)=>{try{return Boolean(JSON.parse(fs.readFileSync(f,'utf8')).nx)}catch{return false}});const hasCsproj=fs.globSync('apps/*/*.csproj').length>0;if(!hasProjectJson&&!hasInlineNx&&!hasCsproj){console.log('No apps to pack - skipping.');process.exit(0)}process.exit(require('node:child_process').spawnSync('npx nx run-many -t package',{stdio:'inherit',shell:true}).status ?? 1)"
        name: Pack all apps (one zip per app -> dist/drop)
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        with:
          name: drop
          path: dist/drop
          if-no-files-found: ignore

      # nx release resolves each package's current version from its git tag,
      # and falls back to the (permanently stale, since git.commit is false)
      # on-disk version when a tag cannot be resolved — which happens
      # whenever this checkout lacks full history. This is currently
      # guaranteed by fetch-depth 0 above plus the explicit fetch below, but
      # neither is expressed as a dependency anywhere else, so this makes it
      # a hard, loud precondition instead of a silently wrong version
      # discovered after release.
      - run: node -e "const r=require('node:child_process').spawnSync('git',['rev-parse','--is-shallow-repository'],{encoding:'utf8'});if(r.status!==0){console.error('Could not determine whether this checkout has full history (git rev-parse --is-shallow-repository failed) - refusing to release. '+(r.stderr||'').trim());process.exit(1)}if(r.stdout.trim()==='true'){console.error('This checkout is a shallow clone. nx release resolves the current version of each package from its git tag, and silently falls back to the permanently-stale on-disk version when a tag cannot be found - which can propose, and publish, a version DOWNGRADE. Fetch full history before releasing - set fetchDepth (Azure) or fetch-depth (GitHub) to 0.');process.exit(1)}"
        name: Verify this is a full checkout (nx release needs the real tag history)
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      # Prove npm will accept us BEFORE anything irreversible happens. nx
      # release tags first and publishes last, so a rejected token leaves a
      # version tagged with nothing on the registry - and that number is then
      # skipped forever, because the next run resolves the current version
      # from the newest tag.
      - run: node -e "const fs=require('node:fs'),cp=require('node:child_process');if(fs.globSync('packages/*/package.json').length===0){console.log('No npm packages to release - skipping.');process.exit(0)}if(!process.env.NODE_AUTH_TOKEN){console.error('NPM_TOKEN is empty or unset, so the publish would fail AFTER nx release has already tagged. Add it as a repository secret named exactly NPM_TOKEN - under Actions, not the Dependabot or Codespaces tab, and not an Environment secret. Use an npm Automation token - a Publish token is refused by 2FA in CI.');process.exit(1)}const r=cp.spawnSync('npm',['whoami','--registry=https://registry.npmjs.org/'],{encoding:'utf8',shell:process.platform==='win32'});if(r.status!==0){console.error('NPM_TOKEN is set but the registry rejected it - '+((r.stderr||'')+(r.stdout||'')).trim()+'. Check that it has not expired and that it grants publish rights on this scope.');process.exit(1)}console.log('npm auth OK as '+r.stdout.trim())"
        name: Preflight — npm must accept the token before anything is tagged
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Version + tag + publish, in one release, for npm (packages/*), Python
      # (python-packages/*) AND C# (packages/*/*.csproj) — conventional
      # commits, tag-only push. Portable guard: nx release errors on an empty
      # scope, so skip cleanly when there is nothing to release. When there
      # are Python or C# packages and an Azure feed, twine/NuGet publish
      # credentials are exported (raw PAT, decoded from the base64 secret).
      #
      # RELEASE_SPECIFIER (repository variable, Settings -> Secrets and
      # variables -> Actions -> Variables) overrides the bump nx would compute
      # from conventional commits for THIS run: 'major', 'minor', 'patch', or
      # an exact version ('1.2.3'). In a workspace with more than one
      # releasable package, a bare keyword is unreliable — nx versions
      # interdependent packages in two passes (a dependency-bump pass, then
      # the specifier pass), and the second pass computes from a version
      # cached before the first pass ran, silently landing back on the same
      # patch bump either way. An exact version does not have this problem,
      # since both passes apply it verbatim — prefer it whenever more than one
      # package is releasable. The guard below fails the run rather than
      # under-bumping silently: unset or clear the variable once the override
      # is no longer needed.
      # This provider also creates a per-project GitHub Release (changelog
      # generated from conventional commits since that project's last tag),
      # which is why 'nx release' pushes the tag itself here — see
      # releaseConfig's remarks for why that is safe on this Nx version and
      # why every other provider combination keeps the explicit push step below.
      - run: node -e "const fs=require('node:fs'),cp=require('node:child_process');const npmCount=fs.globSync('packages/*/package.json').length;const csharpCount=fs.globSync('packages/*/*.csproj').length;const pythonCount=fs.globSync('python-packages/*/pyproject.toml').length;const dartCount=fs.globSync('packages/*/pubspec.yaml').length;const hasNpm=npmCount>0;const hasPython=pythonCount>0;const hasCsharp=csharpCount>0;const hasDart=dartCount>0;if(!hasNpm&&!hasPython&&!hasCsharp&&!hasDart){console.log('Nothing to release - skipping.');process.exit(0)}const specifier=process.env.RELEASE_SPECIFIER||'';let releaseCmd='npx nx release --yes';if(specifier){if(!/^(major|minor|patch|\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$/.test(specifier)){console.error('RELEASE_SPECIFIER value \''+specifier+'\' is invalid - use major, minor, patch, or an exact version like 1.2.3.');process.exit(1)}const releaseProjectCount=npmCount+csharpCount+pythonCount+dartCount;if(/^(major|minor|patch)$/.test(specifier)&&releaseProjectCount>1){console.error('RELEASE_SPECIFIER is a keyword (\''+specifier+'\') but this workspace has '+releaseProjectCount+' releasable packages - a keyword under-bumps interdependent packages, because nx computes the dependency-bump pass from a stale cached version. Set RELEASE_SPECIFIER to an exact version instead, or clear it.');process.exit(1)}releaseCmd='npx nx release '+specifier+' --yes'}const env={...process.env};if(hasPython){if(!process.env.PYPI_TOKEN){console.error('This workspace has '+pythonCount+' Python package(s) to publish but PYPI_TOKEN is empty. Add a PyPI API token as a secret named PYPI_TOKEN, or remove the Python packages from release.projects.');process.exit(1)}env.TWINE_USERNAME='__token__';env.TWINE_PASSWORD=process.env.PYPI_TOKEN;env.TWINE_NON_INTERACTIVE='1'}process.exit(cp.spawnSync(releaseCmd,{stdio:'inherit',shell:true,env}).status ?? 1)"
        name: Release — version, tag, publish and GitHub Release (npm + Python + C#)
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          RELEASE_SPECIFIER: ${{ vars.RELEASE_SPECIFIER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
